name: release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v?*) ;;
            *)
              echo "Invalid release tag '$RELEASE_TAG': expected v followed by a nonempty version." >&2
              exit 1
              ;;
          esac
          version="${RELEASE_TAG#v}"
          case "$version" in
            *[!A-Za-z0-9._-]*)
              echo "Invalid release tag '$RELEASE_TAG': version may contain only A-Z, a-z, 0-9, dot, underscore, and hyphen." >&2
              exit 1
              ;;
          esac

  test:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go vet -tags=dev ./internal/cmd/ingest
      - run: go test -tags=dev ./internal/cmd/ingest
      - run: go test -race -tags=dev ./internal/cmd/ingest

  installer-unix:
    needs: validate-tag
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/installer_test.sh

  installer-powershell:
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Test Windows library index publication
        shell: powershell
        run: go test ./internal/library
      - name: Test installer with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/installer_test.ps1
      - name: Test installer with PowerShell 7
        shell: pwsh
        run: ./tests/installer_test.ps1

  build:
    needs: [validate-tag, test, installer-unix, installer-powershell]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64, ext: ''}
          - {goos: linux, goarch: arm64, ext: ''}
          - {goos: darwin, goarch: amd64, ext: ''}
          - {goos: darwin, goarch: arm64, ext: ''}
          - {goos: windows, goarch: amd64, ext: '.exe'}
          - {goos: windows, goarch: arm64, ext: '.exe'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          go build -trimpath -ldflags="-s -w -X main.version=$version" -o "dist/apis-mcp-${GOOS}-${GOARCH}${{ matrix.ext }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: apis-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum apis-mcp-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          generate_release_notes: true
          files: dist/*
