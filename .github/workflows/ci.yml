name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet -tags=dev ./internal/cmd/ingest
      - run: go test -tags=dev ./internal/cmd/ingest
      - run: go test -race -tags=dev ./internal/cmd/ingest
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -tags=dev -o /tmp/ingest.test.exe ./internal/cmd/ingest
      - run: CGO_ENABLED=0 go build -trimpath .

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath .
