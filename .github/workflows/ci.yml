name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installer-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Test Windows library index publication
        shell: powershell
        run: go test ./internal/library
      - name: Test installer with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/installer_test.ps1
      - name: Test installer with PowerShell 7
        shell: pwsh
        run: ./tests/installer_test.ps1

  installer-unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/installer_test.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet -tags=dev ./internal/cmd/ingest
      - run: go test -tags=dev ./internal/cmd/ingest
      - run: go test -race -tags=dev ./internal/cmd/ingest
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -tags=dev -o /tmp/ingest.test.exe ./internal/cmd/ingest
      - run: CGO_ENABLED=0 go build -trimpath .

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath .
